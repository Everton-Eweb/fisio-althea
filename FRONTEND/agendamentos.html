<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fisio Althea: horários e agendamentos.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/cabecalho-banner.css">
    <link rel="stylesheet" href="css/formulario.css">
    <link rel="stylesheet" href="css/contato-rodape.css">

    <title>Agendamentos — Fisio Althea</title>
</head>

<body>
    <header id="inicio" class="cabecalho-principal">
        <div class="marca-topo">
            <a href="index.html" class="logo-althea" aria-label="Ir para o início do site">
                <img src="img/logo1.png" class="logo-cabecalho" alt="Logotipo da clínica Althea">
            </a>
        </div>

        <nav class="navbar navbar-expand-lg menu-principal" data-bs-theme="dark" aria-label="Navegação principal">
            <div class="container">
                <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuNavegacao" aria-controls="menuNavegacao" aria-expanded="false"
                    aria-label="Abrir menu de navegação">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-center" id="menuNavegacao">
                    <ul class="navbar-nav align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Início</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="index.html#agendamento">Agendar avaliação</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">

            <div id="mensagemAgendamento" class="alert alerta-althea d-none mt-4" role="alert" aria-live="polite"></div>

            <section class="secao-agendamento mt-5 py-5" aria-labelledby="tituloFormulario">
                <div class="text-center mb-4">
                    <h1 id="tituloFormulario">Novo agendamento</h1>
                    <p>Escolha o profissional e a data para ver os horários disponíveis.</p>
                </div>

                <div class="row justify-content-center">
                    <div class="col-12 col-md-10 col-lg-8">
                        <form id="formAgendarHorario" class="formulario-agendamento">
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label for="selectProfissional" class="form-label">Profissional</label>
                                    <select id="selectProfissional" class="form-select" required>
                                        <option value="" selected disabled>Selecione um profissional</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="selectServico" class="form-label">Serviço</label>
                                    <select id="selectServico" class="form-select" required>
                                        <option value="" selected disabled>Selecione um serviço</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label for="campoData" class="form-label">Data</label>
                                    <input type="date" id="campoData" class="form-control" required>
                                </div>
                                <div class="col-12">
                                    <p class="form-label mb-2">Horários disponíveis</p>
                                    <div id="listaHorarios" aria-live="polite"></div>
                                </div>
                                <div class="col-12 text-center">
                                    <button type="submit" id="botaoConfirmar" class="btn btn-althea" disabled>Confirmar agendamento</button>
                                    <button type="button" id="botaoCancelarEdicao" class="btn btn-outline-secondary ms-2 d-none">Voltar</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <section class="py-5" aria-labelledby="tituloMeusAgendamentos">
                <div class="text-center mb-4">
                    <h2 id="tituloMeusAgendamentos">Meus agendamentos</h2>
                </div>
                <div id="listaMeusAgendamentos" class="row g-4"></div>
            </section>

        </div>
    </main>

    <footer class="rodape mt-5">
        <div class="container text-center py-4">
            <p class="mb-1">&copy; 2026 Fisio Althea</p>
            <p class="mb-0">Cuidado, movimento e qualidade de vida.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="js/api.js"></script>
    <script src="js/agendamentos.js"></script>
</body>

</html>
