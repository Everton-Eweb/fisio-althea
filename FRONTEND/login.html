<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesse sua conta de paciente na Fisio Althea.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/cabecalho-banner.css">
    <link rel="stylesheet" href="css/formulario.css">
    <link rel="stylesheet" href="css/contato-rodape.css">

    <title>Entrar — Fisio Althea</title>
</head>

<body>
    <header id="inicio" class="cabecalho-principal">
        <div class="marca-topo">
            <a href="index.html" class="logo-althea" aria-label="Ir para o início do site">
                <img src="img/logo1.png" class="logo-cabecalho" alt="Logotipo da clínica Althea">
            </a>
        </div>

        <nav class="navbar navbar-expand-lg menu-principal" data-bs-theme="dark" aria-label="Navegação principal">
            <div class="container">
                <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuNavegacao" aria-controls="menuNavegacao" aria-expanded="false"
                    aria-label="Abrir menu de navegação">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-center" id="menuNavegacao">
                    <ul class="navbar-nav align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Início</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="index.html#agendamento">Agendar avaliação</a>
                        </li>
                        <li class="nav-item" data-area="visitante">
                            <a class="nav-link active" aria-current="page" href="login.html">Entrar</a>
                        </li>
                        <li class="nav-item d-none" data-area="autenticado">
                            <a class="nav-link" href="minha-conta.html">Minha conta</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <section class="secao-agendamento mt-5 py-5" aria-labelledby="tituloLogin">
                <div class="text-center mb-4">
                    <h1 id="tituloLogin">Bem-vindo de volta</h1>
                    <p>Acesse sua conta para acompanhar seus dados e agendamentos.</p>
                </div>

                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-6">
                        <form id="formLogin" class="formulario-agendamento" novalidate>
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email" name="email"
                                    placeholder="seu@email.com" autocomplete="email" required>
                            </div>

                            <div class="mb-4">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="senha" name="senha"
                                    placeholder="Digite sua senha" autocomplete="current-password" required>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-althea" id="botaoLogin">
                                    Entrar
                                </button>

                                <p class="mt-3 mb-0">
                                    Ainda não tem uma conta?
                                    <a href="cadastro.html">Criar conta</a>
                                </p>
                            </div>
                        </form>

                        <div id="mensagemLogin" class="alert alerta-althea mt-4 d-none" role="alert"
                            aria-live="polite"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="rodape mt-5">
        <div class="container text-center py-4">
            <p class="mb-1">&copy; 2026 Fisio Althea</p>
            <p class="mb-0">Cuidado, movimento e qualidade de vida.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/api.js"></script>
    <script src="js/sessao-ui.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
