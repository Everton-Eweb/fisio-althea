<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/cabecalho-banner.css">
    <link rel="stylesheet" href="css/contato-rodape.css">
</head>

<body>
    <header id="inicio" class="cabecalho-principal">
        <div class="marca-topo">
            <a href="index.html" class="logo-althea" aria-label="Página inicial">
                <img src="img/logo1.png" class="logo-cabecalho" alt="Logotipo da Clínica Althea">
            </a>
        </div>

        <nav class="navbar navbar-expand-lg menu-principal" data-bs-theme="dark"
            aria-label="Navegação principal">
            <div class="container">
                <button class="navbar-toggler ms-auto" type="button"
                    data-bs-toggle="collapse" data-bs-target="#menuNavegacao"
                    aria-controls="menuNavegacao" aria-expanded="false"
                    aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-center" id="menuNavegacao">
                    <ul class="navbar-nav align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Início</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="minha-conta.html">Minha conta</a>
                        </li>
                        <li class="nav-item">
                            <button type="button" class="nav-link btn btn-link"
                                id="botaoSair" style="text-decoration: none;">
                                Sair
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <div class="text-center mb-5">
            <h1>Área do paciente</h1>
            <p>Envie mensagens e acompanhe suas mensagens anteriores.</p>
        </div>

        <div id="mensagemGeral" class="alert d-none"
            role="alert" aria-live="polite"></div>

        <section class="mb-5" aria-labelledby="tituloNovaMensagem">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 id="tituloNovaMensagem" class="h4 mb-4">Nova mensagem</h2>

                    <form id="formMensagem">
                        <div class="mb-3">
                            <label for="assunto" class="form-label">Assunto</label>
                            <input type="text" id="assunto" name="assunto"
                                class="form-control" maxlength="150"
                                placeholder="Informe o assunto (opcional)">
                        </div>

                        <div class="mb-3">
                            <label for="conteudo" class="form-label">Mensagem</label>
                            <textarea id="conteudo" name="conteudo"
                                class="form-control" rows="5" required
                                maxlength="5000"
                                placeholder="Digite sua mensagem"></textarea>
                        </div>

                        <button type="submit" id="botaoEnviar" class="btn btn-primary">
                            Enviar mensagem
                        </button>
                    </form>
                </div>
            </div>
        </section>

        <section aria-labelledby="tituloMinhasMensagens">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <h2 id="tituloMinhasMensagens" class="h4 mb-0">Minhas mensagens</h2>

                <button type="button" id="botaoAtualizar" class="btn btn-outline-primary">
                    Atualizar lista
                </button>
            </div>

            <div id="mensagemLista" class="alert d-none"
                role="status" aria-live="polite"></div>

            <div id="listaMensagens" class="row g-3"></div>
        </section>

        <section id="secaoDetalhes" class="mt-5 d-none"
            aria-labelledby="tituloDetalhes">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                        <h2 id="tituloDetalhes" class="h4">Detalhes da mensagem</h2>
                        <button type="button" id="botaoFecharDetalhes"
                            class="btn btn-outline-secondary btn-sm">
                            Fechar
                        </button>
                    </div>

                    <p class="mb-1">
                        <strong>Assunto:</strong>
                        <span id="detalheAssunto"></span>
                    </p>

                    <p class="mb-1">
                        <strong>Enviada por:</strong>
                        <span id="detalheUsuario"></span>
                    </p>

                    <p class="mb-3">
                        <strong>Data:</strong>
                        <span id="detalheData"></span>
                    </p>

                    <hr>

                    <div id="detalheConteudo"
                        class="text-break"
                        style="white-space: pre-wrap;"></div>

                    <div id="detalheEstado" class="mt-3"></div>

                    <button type="button" id="botaoMarcarLida"
                        class="btn btn-outline-primary mt-3 d-none">
                        Marcar como lida
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer class="rodape mt-5">
        <div class="container text-center py-4">
            <p class="mb-1">&copy; 2026 Fisio Althea</p>
            <p class="mb-0">Cuidado, movimento e qualidade de vida.</p>
        </div>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/api.js"></script>
    <script src="js/mensagens.js"></script>
</body>

</html>
