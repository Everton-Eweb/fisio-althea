<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fisio Althea: crie sua conta de paciente.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/cabecalho-banner.css">
    <link rel="stylesheet" href="css/formulario.css">
    <link rel="stylesheet" href="css/contato-rodape.css">

    <title>Criar conta — Fisio Althea</title>
</head>

<body>

    <!-- ==================================================
         CABEÇALHO E MENU
         ================================================== -->
    <header id="inicio" class="cabecalho-principal">

        <div class="marca-topo">
            <a href="index.html" class="logo-althea" aria-label="Ir para o início do site">
                <img src="img/logo1.png" class="logo-cabecalho" alt="Logotipo da clínica Althea">
            </a>
        </div>

        <nav class="navbar navbar-expand-lg menu-principal" data-bs-theme="dark" aria-label="Navegação principal">
            <div class="container">

                <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuNavegacao" aria-controls="menuNavegacao" aria-expanded="false"
                    aria-label="Abrir menu de navegação">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-center" id="menuNavegacao">
                    <ul class="navbar-nav align-items-lg-center">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                Início
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="index.html#agendamento">
                                Agendar avaliação
                            </a>
                        </li>

                        <li class="nav-item" data-area="visitante">
                            <a class="nav-link" href="login.html">
                                Entrar
                            </a>
                        </li>

                        <li class="nav-item d-none" data-area="autenticado">
                            <a class="nav-link" href="minha-conta.html">
                                Minha conta
                            </a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>

    </header>


    <!-- ==================================================
         FORMULÁRIO DE CADASTRO
         ================================================== -->
    <main>
        <div class="container">

            <section class="secao-agendamento mt-5 py-5" aria-labelledby="tituloCadastro">

                <div class="text-center mb-4">
                    <h2 id="tituloCadastro">
                        Crie sua conta
                    </h2>

                    <p>
                        Cadastre-se para acompanhar seus dados
                        e agendamentos na Fisio Althea.
                    </p>
                </div>

                <div class="row justify-content-center">
                    <div class="col-12 col-md-10 col-lg-8">

                        <form id="formCadastro" class="formulario-agendamento" novalidate>
                            <div class="row g-3">

                                <div class="col-12 col-md-6">
                                    <label for="nome" class="form-label">
                                        Nome completo
                                    </label>

                                    <input type="text" class="form-control" id="nome" name="nome"
                                        placeholder="Digite seu nome" autocomplete="name" required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="email" class="form-label">
                                        E-mail
                                    </label>

                                    <input type="email" class="form-control" id="email" name="email"
                                        placeholder="seu@email.com" autocomplete="email" required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="senha" class="form-label">
                                        Senha
                                    </label>

                                    <input type="password" class="form-control" id="senha" name="senha"
                                        placeholder="Mínimo de 6 caracteres" autocomplete="new-password" minlength="6"
                                        required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="confirmarSenha" class="form-label">
                                        Confirmar senha
                                    </label>

                                    <input type="password" class="form-control" id="confirmarSenha"
                                        name="confirmarSenha" placeholder="Repita a senha" autocomplete="new-password"
                                        minlength="6" required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="telefone" class="form-label">
                                        Telefone
                                    </label>

                                    <input type="tel" class="form-control" id="telefone" name="telefone"
                                        placeholder="(00) 00000-0000" autocomplete="tel" inputmode="tel">
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="dataNascimento" class="form-label">
                                        Data de nascimento
                                    </label>

                                    <input type="date" class="form-control" id="dataNascimento"
                                        name="dataNascimento">
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="cpf" class="form-label">
                                        CPF
                                    </label>

                                    <input type="text" class="form-control" id="cpf" name="cpf"
                                        placeholder="000.000.000-00" inputmode="numeric">
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="endereco" class="form-label">
                                        Endereço
                                    </label>

                                    <input type="text" class="form-control" id="endereco" name="endereco"
                                        placeholder="Rua, número, bairro">
                                </div>

                                <div class="col-12 text-center">
                                    <button type="submit" class="btn btn-althea" id="botaoCadastro">
                                        Criar conta
                                    </button>

                                    <p class="mt-3 mb-0">
                                        Já tem uma conta?
                                        <a href="login.html">Entrar</a>
                                    </p>
                                </div>

                            </div>
                        </form>

                        <!-- Mensagem exibida pelo JavaScript (sucesso ou erro) -->
                        <div id="mensagemCadastro" class="alert alerta-althea mt-4 d-none" role="alert"></div>

                    </div>
                </div>

            </section>

        </div>
    </main>


    <!-- ==================================================
         RODAPÉ
         ================================================== -->
    <footer class="rodape mt-5">
        <div class="container text-center py-4">
            <p class="mb-1">&copy; 2026 Fisio Althea</p>
            <p class="mb-0">Cuidado, movimento e qualidade de vida.</p>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="js/api.js"></script>
    <script src="js/sessao-ui.js"></script>
    <script src="js/cadastro.js"></script>

</body>

</html>
