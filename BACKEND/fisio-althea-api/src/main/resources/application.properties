spring.application.name=fisio-althea-api
# Nome da aplicação
spring.application.name=fisio-althea-api


# ==========================================================
# CONEXÃO COM O BANCO MYSQL
# ==========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/fisio_althea?useSSL=false&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=${DB_PASSWORD}
#root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================================
# SPRING DATA JPA / HIBERNATE
# ==========================================================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# JWT
# =========================================================

# Chave utilizada para assinar os tokens JWT.
# Neste projeto acadêmico/local ela ficará nas propriedades.
# Em produção, o ideal é utilizar variável de ambiente
# ou um gerenciador de segredos.
app.jwt.secret=${JWT_SECRET}
# FisioAltheaJwtSecret2026-ChaveSegura-Para-AmbienteLocal
#########################################################

# Tempo de validade do token em minutos.
app.jwt.expiration-minutes=120